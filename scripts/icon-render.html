<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  svg { display: block; }
</style>
</head>
<body>
<div id="root"></div>
<script>
/* 渲染参数（查询串）：
     r     圆角半径（1024 画布内的值），0 = 直角铺满
     bg    1 = 绘制渐变底，0 = 只留前景（透明，用于安卓自适应图标前景层）
     s     前景缩放，默认 1（安卓前景层用 0.8 收进安全区）
*/
const q = new URLSearchParams(location.search)
const r = Number(q.get('r') ?? 225)
const withBg = (q.get('bg') ?? '1') === '1'
const s = Number(q.get('s') ?? 1)
const fs = Number(q.get('fs') ?? 640)
const dy = Number(q.get('dy') ?? 10)

const DEF = `
  <defs>
    <linearGradient id="bg" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#7A76FF"/>
      <stop offset="0.5" stop-color="#5B47EC"/>
      <stop offset="1" stop-color="#7434DC"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.08" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0.1" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#EDE9FF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#2A1470" flood-opacity="0.22"/>
    </filter>
  </defs>`

const BG = withBg
  ? `<rect width="1024" height="1024" rx="${r}" ry="${r}" fill="url(#bg)"/>
     <rect width="1024" height="1024" rx="${r}" ry="${r}" fill="url(#glow)"/>`
  : ''

/* 「考」：上紧下松，光学居中略偏下 6px 才不显得头重 */
const GLYPH = `
  <g transform="translate(512 512) scale(${s}) translate(-512 -512)">
    <text x="512" y="512" text-anchor="middle" dominant-baseline="central"
          font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif"
          font-size="640" font-weight="700" letter-spacing="-14"
          fill="url(#ink)"${withBg ? ' filter="url(#soft)"' : ''}
          transform="translate(0 ${dy})">考</text>
  </g>`

document.getElementById('root').innerHTML =
  `<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">${DEF}${BG}${GLYPH}</svg>`
</script>
</body>
</html>
